<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Agent Q · Chocolate Challenge</title>

  <style>
    :root {
      --bg: #0f0f11;
      --surface: #1a1a1f;
      --border: #2a2a32;
      --text: #e8e8f0;
      --muted: #8a8aa0;
      --accent: #e8ff47;
      --accent2: #47c8ff;
      --green: #47ffb0;
      --red: #ff6b47;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(232,255,71,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,255,71,0.03) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 34px 28px;
      position: relative;
      z-index: 1;
      box-shadow: 0 24px 80px rgba(0,0,0,0.45);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(232,255,71,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,255,71,0.025) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    .inner {
      position: relative;
      z-index: 2;
    }

    .label {
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 3px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .icon {
      font-size: 54px;
      margin-bottom: 18px;
      line-height: 1;
    }

    h1 {
      font-size: 32px;
      line-height: 1.05;
      margin-bottom: 12px;
      font-weight: 800;
    }

    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      margin-bottom: 24px;
    }

    .btn {
      width: 100%;
      padding: 18px;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: #111;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 4px;
      text-align: center;
      text-decoration: none;
      display: block;
    }

    .btn-secondary {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 14px;
      text-align: center;
      text-decoration: none;
      display: block;
    }

    .btn-secondary:hover {
      border-color: var(--accent2);
      color: var(--accent2);
    }

    .btn-dashboard {
      border-color: var(--accent2);
      color: var(--accent2);
    }

    .code-box {
      background: #0b0b0d;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-top: 18px;
      text-align: center;
    }

    .code-label {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .code {
      color: var(--accent2);
      font-size: 38px;
      letter-spacing: 5px;
      font-weight: 900;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 10px;
      line-height: 1.45;
    }

    .ok {
      color: var(--green);
      font-weight: 700;
      margin-top: 16px;
      font-size: 14px;
    }

    .error {
      color: var(--red);
      font-weight: 700;
      margin-top: 16px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="inner" id="app">
      <div class="label">Agent Q · Demo</div>
      <div class="icon">🍫</div>
      <h1>Lê o QR e entra no sorteio</h1>
      <p>A carregar...</p>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwf27iC8Y_iczVpY6FsFHVvPzX4v8RkLYbAnvQoC-Uhc5QXzLYIVRkZb5tV49R--ubwAw/exec";
    const DASHBOARD_URL = "https://demo-chocolate-dashboard.streamlit.app/";

    const EVENT_ID = "demo_apresentacao_chocolate";
    const STORAGE_TOKEN = "demo_chocolate_token_v5";
    const STORAGE_CODE = "demo_chocolate_code_v5";

    function gerarToken() {
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c === "x" ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function gerarCodigoCurto(token) {
      return token.replace(/-/g, "").slice(-6).toUpperCase();
    }

    function dashboardButton() {
      return '<a class="btn-secondary btn-dashboard" href="' + DASHBOARD_URL + '" target="_blank" rel="noopener noreferrer">Ver dashboard dos resultados</a>';
    }

    function renderHome() {
      const token = localStorage.getItem(STORAGE_TOKEN);
      const code = localStorage.getItem(STORAGE_CODE);

      if (token && code) {
        renderCode(code);
        return;
      }

      document.getElementById("app").innerHTML =
        '<div class="label">Agent Q · Demo</div>' +
        '<div class="icon">🍫</div>' +
        '<h1>Lê o QR e entra no sorteio</h1>' +
        '<p>Regista a tua presença nesta pequena experiência. Vais receber um código para guardar até ao final do evento.</p>' +
        '<button class="btn" onclick="registar()">Quero participar</button>' +
        dashboardButton() +
        '<button class="btn-secondary" onclick="resetLocal()">Reset / novo teste</button>';
    }

    function renderLoading() {
      document.getElementById("app").innerHTML =
        '<div class="label">Agent Q · Demo</div>' +
        '<div class="icon">⏳</div>' +
        '<h1>A registar...</h1>' +
        '<p>Estamos a gerar o teu código.</p>';
    }

    function renderCode(code) {
      document.getElementById("app").innerHTML =
        '<div class="label">Agent Q · Demo</div>' +
        '<div class="icon">🎟️</div>' +
        '<h1>Estás registado</h1>' +
        '<p>Guarda este código até ao final do evento.</p>' +
        '<div class="code-box">' +
          '<div class="code-label">O teu código</div>' +
          '<div class="code">' + code + '</div>' +
          '<div class="hint">No final do evento, se o teu código tiver sido o escolhido, vem ter com a equipa Agent Q para receberes o chocolate.</div>' +
        '</div>' +
        '<div class="ok">Registo concluído.</div>' +
        dashboardButton() +
        '<button class="btn-secondary" onclick="resetLocal()">Reset / novo teste</button>';
    }

    function renderError(message) {
      document.getElementById("app").innerHTML =
        '<div class="label">Agent Q · Demo</div>' +
        '<div class="icon">⚠️</div>' +
        '<h1>Não foi possível registar</h1>' +
        '<p>Verifica a ligação à internet e tenta novamente.</p>' +
        '<div class="error">' + (message || "O registo não foi confirmado.") + '</div>' +
        dashboardButton() +
        '<button class="btn-secondary" onclick="renderHome()">Voltar</button>' +
        '<button class="btn-secondary" onclick="resetLocal()">Reset / novo teste</button>';
    }

    async function registar() {
      renderLoading();

      const token = gerarToken();
      const code = gerarCodigoCurto(token);
      const now = new Date();

      const payload = {
        event_id: EVENT_ID,
        token_id: token,
        codigo_curto: code,
        registo_ts: now.toISOString(),
        registo_local: now.toLocaleString("pt-PT"),
        origem: "qr_demo_chocolate",
        claimed: "nao"
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        localStorage.setItem(STORAGE_TOKEN, token);
        localStorage.setItem(STORAGE_CODE, code);

        renderCode(code);

      } catch (e) {
        renderError();
      }
    }

    function resetLocal() {
      localStorage.removeItem(STORAGE_TOKEN);
      localStorage.removeItem(STORAGE_CODE);
      renderHome();
    }

    document.addEventListener("DOMContentLoaded", renderHome);
  </script>
</body>
</html>
